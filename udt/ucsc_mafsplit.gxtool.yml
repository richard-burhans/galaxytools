class: GalaxyUserTool
id: gt-ucsc-mafsplit
version: "482+galaxy1"
name: ucsc_mafsplit (UDT)
description: ": split a MAF into one file per reference sequence or hashed bucket"
container: quay.io/biocontainers/ucsc-mafsplit:482--h0b57e2e_0
shell_command: |
  set -e
  cat > script.cfg <<'CONFIGFILE_SCRIPT'
  set -eu
  input="$1"; bits="$2"
  case "$bits" in ''|*[!0-9]*) echo "hash bits must be a whole number: $bits" >&2; exit 1;; esac
  if [ "$bits" -eq 0 ]; then mode=-useFullSequenceName; else mode=-useHashedName=$bits; fi
  mkdir out
  cd out
  mafSplit -byTarget $mode /dev/null . "$input"
  CONFIGFILE_SCRIPT
  sh script.cfg '$(inputs.input.path)' '$(inputs.hash_bits)'
inputs:
  - name: input
    type: data
    format: maf
    label: "MAF"
    help: "The reference must be the top row of every block."
  - name: hash_bits
    type: integer
    value: 8
    label: "Hash bits (0: one file per reference sequence)"
    help: "N > 0: split into up to 2^N hashed buckets of reference sequences (-useHashedName=N), as UCSC's multizNway builds do before multiz, with 8. A sequence always lands in the same bucket, so splits of different species' MAFs line up by bucket name. 0: one file per reference sequence (-useFullSequenceName), as they do before mafAddIRows."
outputs:
  - name: pieces
    type: collection
    collection_type: list
    discover_datasets:
      - discover_via: pattern
        pattern: "(?P<designation>.+)\\.maf$"
        format: maf
        visible: false
        sort_key: "filename"
        directory: "out"
    label: "pieces"
help:
  format: markdown
  content: |
    **What it does**

    Runs kent's ``mafSplit -byTarget`` and returns the pieces as a collection, named by bucket (``033``)
    or by reference sequence (``chr21``, ``NC_044371.1``).

    UCSC's multizNway builds use it twice (kent ``src/hg/makeDb/doc/hg38/multiz5way.txt``):

    * **before multiz**, per species: ``mafSplit -byTarget -useHashedName=8 /dev/null . hg38.<species>.synNet.maf.gz``.
      Every species' split uses the same hash of the reference sequence name, so bucket ``033`` of every
      species covers the same reference sequences, and roast runs once per bucket.
    * **before mafAddIRows**, on the combined multiple alignment:
      ``mafSplit -byTarget -useFullSequenceName``, because ``mafAddIRows`` handles one reference sequence
      per file.

    The species prefix is everything before the first ``.`` of a row's source, so a versioned accession
    (``cs10.NC_044371.1``) keeps its version in the piece name.

    .. _source code: https://github.com/ucscGenomeBrowser/kent/tree/master/src/hg/ratStuff/mafSplit
