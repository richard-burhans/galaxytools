class: GalaxyUserTool
id: gt-ucsc-mafsplit-bed
version: "482+galaxy0"
name: ucsc_mafsplit_bed (UDT)
description: ": cut a MAF into pieces at bed positions, bundling the other sequences"
container: quay.io/biocontainers/ucsc-mafsplit:482--h0b57e2e_0
shell_command: |
  set -e
  cat > script.cfg <<'CONFIGFILE_SCRIPT'
  set -eu
  input="$1"; splits="$2"
  LC_ALL=C; export LC_ALL
  ## mafSplit takes each sequence's cuts in FILE order and skips any cut that lies behind the previous one,
  ## so the cuts are sorted first, as UCSC sorts mafSplitPos's output (hg38 multiz100way.txt).
  sed '/^#/d; /^track/d; /^browser/d; /^[[:space:]]*$/d' "$splits" | sort -k1,1 -k2,2n > cuts.bed
  ## The bed's sequences, plus a line no sequence can match: BusyBox grep -v -f with an empty pattern
  ## file selects nothing at all, where GNU grep selects everything.
  sed 's/[[:space:]].*//' cuts.bed | sort -u > cut_seqs
  printf '\t\n' >> cut_seqs
  if grep -qxF small cut_seqs; then echo "a sequence of the bed is named small, the bundle's name" >&2; exit 5; fi
  ## Read-only checks of the reference rows (the first row of each block), and the bases of every row.
  ## mafSplit names a sequence after the first '.' of its row (after the second for a GC* name, as kent's
  ## chromFromSrc does). It reopens a sequence's first piece for writing whenever the sequence reappears,
  ## so a sequence whose blocks are not together silently loses all but its last run: refuse that.
  n_in=`awk '
  /^a/ { top = 1; next }
  /^s / {
      n += $4
      if (!top) next
      top = 0
      i = index($2, ".")
      if (i == 0) { print "row " $2 " is not named species.sequence"; bad = 1; exit }
      c = substr($2, i + 1)
      if (substr($2, 1, 2) == "GC") { j = index(c, "."); if (j) c = substr(c, j + 1) }
      if (c != prev) {
          if (c in seen) { print "the blocks of " c " are not together; sort the MAF by reference position"; bad = 1; exit }
          seen[c] = 1; prev = c; last = -1
      }
      if ($3 + 0 < last) { print c " is not sorted by reference start: " $3 " after " last; bad = 1; exit }
      last = $3 + 0
  }
  END { if (!bad) print n + 0 }' "$input"`
  case "$n_in" in ''|*[!0-9]*) echo "$n_in" >&2; exit 3;; esac
  mkdir split out
  mafSplit cuts.bed split/ "$input"
  ## mafSplit writes a header-only file for a piece with no blocks that lies between two pieces with
  ## blocks, but none for a piece after a sequence's last block. Drop the empty ones, so a piece exists
  ## exactly when it has blocks, whatever its position.
  for f in split/*.maf; do
      [ -e "$f" ] || continue
      grep -q '^a' "$f" || rm "$f"
  done
  ## Every sequence the bed does not name goes into small.00, in sorted name order. Written with
  ## head/tail, which fail on a write error (BusyBox awk and sed do not).
  ls split | sed -n 's/\.00\.maf$//p' | grep -vxF -f cut_seqs | sort > small_seqs
  k=0
  while read -r s; do
      for f in "split/$s".[0-9][0-9].maf; do
          [ -e "$f" ] || continue
          [ -e out/small.00.maf ] || head -n 1 "$f" > out/small.00.maf
          tail -n +2 "$f" >> out/small.00.maf
          rm "$f"
      done
      k=`expr $k + 1`
  done < small_seqs
  for f in split/*.maf; do
      [ -e "$f" ] || continue
      mv "$f" out/
  done
  ## Nothing lost: every row's bases are in exactly one piece (a cut block's halves add up).
  n_out=0
  if [ -n "`ls out`" ]; then n_out=`cat out/*.maf | awk '/^s / { n += $4 } END { print n + 0 }'`; fi
  if [ "$n_out" != "$n_in" ]; then echo "the pieces hold $n_out bases of the input's $n_in" >&2; exit 4; fi
  ## And every piece is small.00 or a piece of a bed sequence.
  printf 'small\n' >> cut_seqs
  stray=`ls out | sed 's/\.[0-9]*\.maf$//' | grep -vxF -f cut_seqs || true`
  if [ -n "$stray" ]; then echo "pieces of sequences not in the bed escaped the bundle: $stray" >&2; exit 6; fi
  echo "pieces: `ls out | wc -l`; bundled $k sequence(s) into small.00"
  CONFIGFILE_SCRIPT
  sh script.cfg '$(inputs.input.path)' '$(inputs.splits.path)'
inputs:
  - name: input
    type: data
    format: maf
    label: "MAF"
    help: "The reference must be the top row of every block, named species.sequence (cs10_NCBI_RefSeq_softmasked.NC_044371.1), and each reference sequence's blocks must be together and sorted by start, as axtSort | axtToMaf gives."
  - name: splits
    type: data
    format: bed
    label: "Cut positions"
    help: "One line per cut: the sequence (without the species prefix) and the position in chromStart. chromEnd is ignored; mafSplitPos writes pos, pos+1. Order does not matter."
outputs:
  - name: pieces
    type: collection
    collection_type: list
    discover_datasets:
      - discover_via: pattern
        pattern: "(?P<designation>.+)\\.maf$"
        format: maf
        visible: false
        sort_key: "filename"
        directory: "out"
    label: "pieces"
help:
  format: markdown
  content: |
    **What it does**

    Cuts a MAF at given positions of its reference sequences with kent's ``mafSplit`` (bed mode, no
    ``-byTarget``), as UCSC's multizNway builds do before roast (kent ``src/hg/makeDb/doc/hg38/multiz100way.txt``):

    ::

        mafSplitPos -minGap=10000 hg38 5 stdout | sort -u | sort -k1,1 -k2,2n > mafSplit.bed
        mafSplit mafSplit.bed hg38_ hg38.<species>.synNet.maf.gz

    then bundles every reference sequence the bed does not name into one piece, ``small.00``.

    **Cut positions.** Each bed line is one cut, at **chromStart**; chromEnd is ignored (mafSplitPos writes
    ``chrom pos pos+1``). Sequence ``s`` cut at positions p1 < p2 < ... gives ``s.00`` = [0, p1),
    ``s.01`` = [p1, p2), and so on. The bed is sorted by the tool (kent's mafSplit takes the cuts in file
    order and would lose any cut behind the previous one). The bed names sequences without the species
    prefix: ``NC_044371.1`` matches the row ``cs10_NCBI_RefSeq_softmasked.NC_044371.1``. As in kent, the
    sequence is everything after the row's first ``.``, or after its second for a species name starting
    ``GC`` (a GenArk accession).

    A block across a cut is cut in two (kent's ``mafSubset``), every row at the same column, so no base is
    lost; each half is given score 0. Place cuts in reference gaps (N runs, as mafSplitPos does) and no
    block meets one.

    **Output**: a list of MAFs named ``<sequence>.NN`` (``NC_044371.1.00``), plus ``small.00`` holding every
    sequence not in the bed, one header, in C-locale sorted sequence-name order. Every species split with
    the same bed gets the same names for the pieces it has.

    .. warning:: A piece in which a species has no blocks is **absent** from that species' collection,
       wherever it falls (kent writes an empty piece between two others, and none after a sequence's last
       block; the tool drops the empty ones). Downstream, take the **union** of piece names over all
       species, as UCSC's ``run.maf.list`` does, and let roast stub a species missing from a piece.

    **Refusals.** Each reference sequence's blocks must be together and sorted by start (exit 3): kent's
    mafSplit reopens a sequence's first piece whenever the sequence reappears and keeps only the last run,
    at exit 0. A bed sequence may not be named ``small`` (exit 5). The tool checks that the pieces hold
    exactly the bases of the input (exit 4) and that no piece of an unnamed sequence escaped the bundle
    (exit 6). stdout reports ``pieces: N; bundled K sequence(s) into small.00``.

    .. _source code: https://github.com/ucscGenomeBrowser/kent/tree/master/src/hg/ratStuff/mafSplit
