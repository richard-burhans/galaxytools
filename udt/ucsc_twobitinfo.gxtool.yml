class: GalaxyUserTool
id: gt-ucsc-twobitinfo
version: "482+galaxy0"
name: ucsc_twobitinfo (UDT)
description: ": sequence sizes, or N-run and soft-mask BED, of a 2bit file"
container: quay.io/biocontainers/ucsc-twobitinfo:482--hdc0a859_0
shell_command: |
  set -e
  twoBitInfo $(inputs.report) '$(inputs.input.path)' output.dat
inputs:
  - name: input
    type: data
    format: twobit
    label: "2bit file"
  - name: report
    type: select
    options:
      - label: "Runs of N, as BED (-nBed)"
        value: "-nBed"
        selected: true
      - label: "Soft-masked (lowercase) runs, as BED (-maskBed)"
        value: "-maskBed"
      - label: "Sequence sizes"
        value: ""
      - label: "Sequence sizes, not counting N (-noNs)"
        value: "-noNs"
    label: "Report"
outputs:
  - name: output
    type: data
    format: bed
    from_work_dir: output.dat
help:
  format: markdown
  content: |
    **What it does**

    Runs kent's ``twoBitInfo``. With ``-nBed`` it writes one BED record per run of ``N``: what UCSC's
    multizNway builds make for every species (``twoBitInfo -nBed ${DB}.2bit ${DB}.N.bed``) and hand to
    ``mafAddIRows -nBeds``, which uses them to mark a species' gap as missing sequence rather than
    unaligned sequence.

    .. _source code: https://github.com/ucscGenomeBrowser/kent/tree/master/src/utils/twoBitInfo
