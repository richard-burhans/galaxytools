class: GalaxyUserTool
id: gt-ucsc-axtsort
version: "482+galaxy0"
name: ucsc_axtsort (UDT)
description: ": sort AXT alignments by target position"
container: quay.io/biocontainers/ucsc-axtsort:482--h0b57e2e_0
shell_command: |
  set -e
  axtSort '$(inputs.input.path)' output.dat
inputs:
  - name: input
    type: data
    format: axt
    label: "AXT alignments"
outputs:
  - name: output
    type: data
    format: axt
    from_work_dir: output.dat
help:
  format: markdown
  content: |
    **What it does**

    Sorts AXT blocks by target sequence name (``strcmp``), then target start -- ``axtCmpTarget`` in kent's
    ``src/lib/axt.c``.

    UCSC runs it between ``netToAxt`` and ``axtToMaf`` when building multiz input
    (``doBlastzChainNet.pl``: ``netToAxt ... | axtSort stdin stdout``). ``netToAxt`` emits blocks in net
    order, where nested fills follow their parent, so its output is not target-sorted -- and multiz fed
    unsorted pairwise alignments merges them wrongly with exit status 0.

    .. warning:: Every block is held in memory. Use it on net-derived AXT, not raw lastz output.

    .. _source code: https://github.com/ucscGenomeBrowser/kent/tree/master/src/hg/mouseStuff/axtSort
