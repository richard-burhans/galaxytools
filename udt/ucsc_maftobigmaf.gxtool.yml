class: GalaxyUserTool
id: gt-ucsc-maftobigmaf
version: "482+galaxy0"
name: ucsc_maftobigmaf (UDT)
description: ": turn a MAF into bigMaf text, for bedToBigBed"
container: quay.io/biocontainers/ucsc-maftobigmaf:482--h0b57e2e_0
shell_command: |
  set -e
  cat > script.cfg <<'CONFIGFILE_SCRIPT'
  set -eu
  ref="$1"; input="$2"; output="$3"
  LC_ALL=C; export LC_ALL
  case "$ref" in ''|*[!A-Za-z0-9_]*) echo "reference name must be letters, digits or _: $ref" >&2; exit 2;; esac
  blocks=`grep -c '^a' "$input" || true`
  case "$blocks" in ''|*[!0-9]*) echo "could not count the blocks of the input" >&2; exit 4;; esac
  ## The browser finds the reference rows as <hub genome>.<sequence>, and a wrong name draws an empty track
  ## with no error, so say so here, from the first block. mafToBigMaf checks every block after it.
  top=`grep -m 1 '^s ' "$input" | sed 's/^s[[:space:]]*//; s/[[:space:]].*//' || true`
  if [ "$blocks" -gt 0 ]; then
      case "$top" in "$ref".?*) ;; *) echo "the first block's top row is $top, not $ref.<sequence>" >&2; exit 3;; esac
  fi
  ## mafToBigMaf aborts (exit 255) on a block whose top row is not the reference, and on a reference row that
  ## starts before the previous one ends: input out of order, or a reference base covered twice. Both are
  ## kept fatal. That check is also why no sort follows, as it does in UCSC's recipe: within each run of
  ## one sequence the output is already in start order. The images' sort is BusyBox's, which holds its
  ## whole input in memory.
  mafToBigMaf "$ref" "$input" "$output"
  ## One line per block, or something was lost. mafToBigMaf never checks its writes: to a full disk it
  ## exits 0 with a short file (measured, /dev/full), so this count is the only detector.
  lines=`wc -l < "$output"`
  if [ "$lines" -ne "$blocks" ]; then echo "$lines bigMaf lines for $blocks blocks" >&2; exit 4; fi
  ## bedToBigBed needs each sequence's lines together; mafToBigMaf does not check that across sequences.
  again=`cut -f1 "$output" | uniq | sort | uniq -d`
  if [ -n "$again" ]; then echo "blocks of $again are not together in the input; sort it by reference sequence and start" >&2; exit 5; fi
  echo "blocks: $blocks; sequences: `cut -f1 "$output" | uniq | wc -l`"
  CONFIGFILE_SCRIPT
  sh script.cfg '$(inputs.reference)' '$(inputs.input.path)' output.dat
inputs:
  - name: input
    type: data
    format: maf
    label: "MAF"
    help: "The reference as the top row of every block, named reference.sequence, each sequence's blocks together and in start order, no reference base covered twice: roast's output, or pieces of it joined in order."
  - name: reference
    type: text
    value: ""
    label: "Reference name"
    help: "The hub genome name the reference rows carry (cs10_NCBI_RefSeq_softmasked for cs10_NCBI_RefSeq_softmasked.NC_044371.1). The browser finds the rows by it, so a wrong one draws an empty track. Letters, digits and _ only."
outputs:
  - name: output
    type: data
    format: bed
    from_work_dir: output.dat
    label: "bigMaf text"
help:
  format: markdown
  content: |
    **What it does**

    Runs kent's ``mafToBigMaf`` and returns the bigMaf text: one line per MAF block, ``chrom``,
    ``chromStart``, ``chromEnd`` of the reference row and the whole block with ``;`` for its newlines.
    ``bedToBigBed`` makes the track from it, as in UCSC's vgp577way build (kent
    ``src/hg/makeDb/doc/vgp577way/vgp577way.txt``):

    ::

        mafToBigMaf <reference> in.maf stdout | sort -k2,2n | gzip -c > chr.bigMaf.gz
        bedToBigBed -itemsPerSlot=4 -type=bed3+1 -as=bigMaf.as -tab all.bigMaf.gz chrom.sizes out.bb

    **The reference name** is the hub genome name the reference rows carry: ``cs10_NCBI_RefSeq_softmasked``
    for ``s cs10_NCBI_RefSeq_softmasked.NC_044371.1``. The output's ``chrom`` is the part after it. The
    browser looks for ``<hub genome>.<chrom>`` rows and hubCheck does not test it, so a wrong name gives
    an empty track with no error; here it fails the job.

    **No sort.** UCSC sorts mafToBigMaf's output by start. That sort cannot change anything:
    mafToBigMaf refuses a reference row that starts before the previous one of the same sequence ends,
    so within each run of one sequence the lines are already in start order. What bedToBigBed also needs
    is each sequence in one run, which the tool checks instead. (The image's ``sort`` is BusyBox's, which
    holds its whole input in memory: a chromosome's bigMaf text can be several GB.)

    **Refusals**, all fatal:

    * exit 2: the reference name has a character other than letters, digits and ``_``;
    * exit 3: the first block's top row is not ``<reference>.<sequence>``;
    * exit 255: mafToBigMaf, on a later block whose top row is not the reference, or on reference rows
      out of order or overlapping (a reference base covered twice);
    * exit 4: the output does not have one line per block (empty, or short);
    * exit 5: a sequence's blocks are not together.

    The output is Galaxy ``bed`` (bigMaf text is bed3+1; Galaxy has no bigMaf text datatype). Give it to
    bedToBigBed with ``-type=bed3+1``, ``-as`` kent's ``bigMaf.as`` and ``-tab``.

    .. _source code: https://github.com/ucscGenomeBrowser/kent/tree/master/src/hg/utils/mafToBigMaf
