class: GalaxyUserTool
id: gt-growler-lastz-lav
version: "1.04.52+galaxy1"
name: growler_lastz_lav (UDT)
description: "gapped extension of one KegAlign pair file, one target per lastz call, LAV out"
container: quay.io/biocontainers/kegalign-full:0.3.4--hdfd78af_0
shell_command: |
  set -e
  cat > driver.cfg <<'CONFIGFILE_DRIVER'
  import gzip
  import os
  import subprocess
  import sys

  pair, scores, gappedthresh, ydrop, inner, masking, output = sys.argv[1:8]
  CHUNK = 50000
  FLUSH = 20000

  with open(pair, 'rb') as fh:
      gz = fh.read(2) == b'\x1f\x8b'
  reader = gzip.open(pair, 'rb') if gz else open(pair, 'rb')

  os.makedirs('by_target', exist_ok=True)
  order = []
  index = {}
  buffers = {}


  def flush(t):
      with open(os.path.join('by_target', str(index[t])), 'ab') as out:
          out.writelines(buffers[t])
      buffers[t] = []


  with reader:
      for line in reader:
          if not line.strip():
              continue
          t = line.split(b'\t', 1)[0]
          if t not in index:
              index[t] = len(order)
              order.append(t)
              buffers[t] = []
          buffers[t].append(line)
          if len(buffers[t]) >= FLUSH:
              flush(t)
  for t in order:
      flush(t)

  calls = 0
  with open(output, 'wb') as out:
      for t in order:
          with open('subset.txt', 'wb') as fh:
              fh.write(t + b'\n')
          with open(os.path.join('by_target', str(index[t])), 'rb') as fh:
              done = False
              while not done:
                  lines = []
                  for line in fh:
                      lines.append(line)
                      if len(lines) == CHUNK:
                          break
                  done = len(lines) < CHUNK
                  if not lines:
                      break
                  with open('chunk.segments', 'wb') as ch:
                      ch.writelines(lines)
                  cmd = ['lastz', 'target.2bit[subset=subset.txt,nameparse=darkspace]',
                         'query.2bit[nameparse=darkspace]', '--allocate:traceback=2G',
                         '--segments=chunk.segments', '--scores=' + scores,
                         '--gappedthresh=' + gappedthresh, '--ydrop=' + ydrop,
                         '--inner=' + inner, '--masking=' + masking,
                         '--format=lav', '--output=chunk.lav']
                  rc = subprocess.run(cmd).returncode
                  if rc != 0:
                      sys.exit('lastz exited %d on target %s' % (rc, t.decode()))
                  with open('chunk.lav', 'rb') as lav:
                      while True:
                          block = lav.read(1 << 22)
                          if not block:
                              break
                          out.write(block)
                  calls += 1
  print('%d target(s), %d lastz call(s)' % (len(order), calls))
  CONFIGFILE_DRIVER
  ln -s '$(inputs.target.path)' target.2bit
  ln -s '$(inputs.query.path)' query.2bit
  python3 driver.cfg '$(inputs.pair.path)' '$(inputs.scores.path)' '$(inputs.gappedthresh)' '$(inputs.ydrop)' '$(inputs.inner)' '$(inputs.masking)' output.dat
inputs:
  - name: pair
    type: data
    format: tabular.gz,tabular
    label: "Pair file"
    help: "One element of KegAlign's pair-file collection: anchor segments, both strands, any number of targets."
  - name: target
    type: data
    format: twobit
    label: "Target sequence (2bit)"
  - name: query
    type: data
    format: twobit
    label: "Query sequence (2bit)"
  - name: scores
    type: data
    format: txt
    label: "Scoring file in LASTZ format"
    help: "Required, not optional: it must match the scoring KegAlign seeded with, and a UDT cannot express an optional argument."
  - name: gappedthresh
    type: integer
    value: 3000
    label: "Gapped extension threshold"
  - name: ydrop
    type: integer
    value: 9430
    label: "Y-drop"
  - name: inner
    type: integer
    value: 0
    label: "Interpolation threshold (blastz H)"
    help: "0 is lastz's default, off; measured byte-identical to omitting the option. UCSC's hg38 x panTro6 run used H=2000."
  - name: masking
    type: integer
    value: 0
    label: "Dynamic masking count (blastz M)"
    help: "0 is lastz's default, off. UCSC's hg38 x panTro6 run used M=254."
outputs:
  - name: output
    type: data
    format: lav
    from_work_dir: output.dat
    label: "output"
help:
  format: markdown
  content: |
    **What it does**

    Gapped extension for one KegAlign pair file, writing LAV. The pair file is split by target sequence
    (a stable partition, which keeps lastz's ordering rules), and each target's segments are run through
    lastz in calls of at most 50,000 segments, each with that one target selected.

    Convert the result with **lavToPsl** and chain it with **axtChain** on PSL input -- the route UCSC's
    ``doBlastzChainNet.pl`` takes. On a real 50,000-segment Cannabis chunk the PSL was 10x smaller than
    the equivalent AXT and gave identical chains.
