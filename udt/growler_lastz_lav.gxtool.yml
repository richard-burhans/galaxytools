class: GalaxyUserTool
id: gt-growler-lastz-lav
version: "1.04.52+galaxy4"
name: growler_lastz_lav (UDT)
description: "gapped extension of one KegAlign pair file, one target per lastz call, LAV out"
container: quay.io/biocontainers/kegalign-full:0.3.4--hdfd78af_0
shell_command: |
  set -e
  cat > driver.cfg <<'CONFIGFILE_DRIVER'
  import gzip
  import os
  import shutil
  import subprocess
  import sys

  pair, scores, gappedthresh, ydrop, inner, masking, output = sys.argv[1:8]
  inner = '0' if inner in ('null', '') else inner
  masking = '0' if masking in ('null', '') else masking
  CHUNK = 50000
  FLUSH = 20000
  LAV_TRAILER = b'#:eof'
  #: the window repair_killed_jobs.py already proved against real panel LAV files.
  TRAILER_WINDOW = 80


  def require_wellformed(path, what):
      # ⛔ THE TRAILER PROVES THE END ARRIVED; IT PROVES NOTHING ABOUT THE MIDDLE. MEASURED
      # 2026-10-08 on STLR: a 203,016,405-byte assembled LAV ended with '#:eof', passed both
      # trailer checks, its producer exited 0, and it held ONE malformed line --
      # "l 189759 214085#:lav", cut mid-number with a header abutting the stump. Three lavToPsl
      # jobs died on it with 'Expecting 6 words line 4431827' and 38 jobs paused behind them.
      # ⚠ Counting '#:eof' against the lastz call count does NOT catch it: the file held 181 for
      # 181 calls, balanced, because a chunk's LAV carries 2-11 '#:lav' headers of its own.
      # So assert what the CONSUMER requires -- 6 fields on every 'l' row, lavToPsl's own
      # expectation -- in one pass, measured at 0.9 s over 203 MB.
      with open(path, 'rb') as fh:
          for n, line in enumerate(fh, 1):
              if b'#:lav' in line and not line.startswith(b'#:lav'):
                  sys.exit('%s: line %d has content abutting a #:lav header (%r) -- bytes were '
                           'lost mid-file while assembling it. The output is NOT safe to build '
                           'chains on.' % (what, n, line[:60]))
              stripped = line.strip()
              if stripped[:2] == b'l ' and len(stripped.split()) != 6:
                  sys.exit('%s: line %d is an alignment row with %d fields, not 6 (%r) -- '
                           'lavToPsl rejects this as "Expecting 6 words". The output is NOT safe '
                           'to build chains on.' % (what, n, len(stripped.split()), line[:60]))


  def require_trailer(path, what):
      # lastz closes every LAV it finishes with '#:eof'. Its absence means the write stopped
      # early -- which is the one failure Galaxy cannot see: a truncated LAV is still megabytes,
      # still parses as a datatype, and the job still reports ok. It surfaces much later as
      # lavToPsl 'End before start' or 'Expecting 6 words', by which point the pair looks
      # computed. The exit code does not cover it: a full disk can stop the write with lastz
      # still exiting 0. Checked by absolute offset from the end, never a negative-range read.
      size = os.path.getsize(path)
      with open(path, 'rb') as fh:
          fh.seek(max(0, size - TRAILER_WINDOW))
          tail = fh.read()
      if LAV_TRAILER not in tail:
          sys.exit('%s: no %s trailer in the last %d of %d bytes -- lastz did not finish '
                   'writing it. The output is truncated (a full disk is the usual cause); '
                   'it is NOT safe to build chains on.'
                   % (what, LAV_TRAILER.decode(), TRAILER_WINDOW, size))

  with open(pair, 'rb') as fh:
      gz = fh.read(2) == b'\x1f\x8b'
  reader = gzip.open(pair, 'rb') if gz else open(pair, 'rb')

  shutil.rmtree('by_target', ignore_errors=True)
  os.makedirs('by_target')
  order = []
  index = {}
  buffers = {}


  def flush(t):
      with open(os.path.join('by_target', str(index[t])), 'ab') as out:
          out.writelines(buffers[t])
      buffers[t] = []


  with reader:
      for line in reader:
          if not line.strip():
              continue
          t = line.split(b'\t', 1)[0]
          if t not in index:
              index[t] = len(order)
              order.append(t)
              buffers[t] = []
          buffers[t].append(line)
          if len(buffers[t]) >= FLUSH:
              flush(t)
  for t in order:
      flush(t)

  calls = 0
  with open(output, 'wb') as out:
      for t in order:
          with open('subset.txt', 'wb') as fh:
              fh.write(t + b'\n')
          with open(os.path.join('by_target', str(index[t])), 'rb') as fh:
              done = False
              while not done:
                  lines = []
                  for line in fh:
                      lines.append(line)
                      if len(lines) == CHUNK:
                          break
                  done = len(lines) < CHUNK
                  if not lines:
                      break
                  with open('chunk.segments', 'wb') as ch:
                      ch.writelines(lines)
                  cmd = ['lastz', 'target.2bit[subset=subset.txt,nameparse=darkspace]',
                         'query.2bit[nameparse=darkspace]', '--allocate:traceback=2G',
                         '--segments=chunk.segments', '--scores=' + scores,
                         '--gappedthresh=' + gappedthresh, '--ydrop=' + ydrop,
                         '--inner=' + inner, '--masking=' + masking,
                         '--format=lav', '--output=chunk.lav']
                  rc = subprocess.run(cmd).returncode
                  if rc != 0:
                      sys.exit('lastz exited %d on target %s' % (rc, t.decode()))
                  require_trailer('chunk.lav', 'chunk %d of target %s' % (calls + 1, t.decode()))
                  with open('chunk.lav', 'rb') as lav:
                      while True:
                          block = lav.read(1 << 22)
                          if not block:
                              break
                          out.write(block)
                  calls += 1

  # ⚠ AFTER THE `with` CLOSES, so the buffer is flushed and a write error has been raised.
  # Guarded on `calls` because an empty pair file legitimately produces no lastz call and so
  # no trailer -- asserting unconditionally would fail the one case that is genuinely empty.
  if calls:
      require_trailer(output, 'the assembled LAV output')
      require_wellformed(output, 'the assembled LAV output')
  print('%d target(s), %d lastz call(s)' % (len(order), calls))
  CONFIGFILE_DRIVER
  ln -s '$(inputs.target.path)' target.2bit
  ln -s '$(inputs.query.path)' query.2bit
  python3 driver.cfg '$(inputs.pair.path)' '$(inputs.scores.path)' '$(inputs.gappedthresh)' '$(inputs.ydrop)' '$(inputs.inner)' '$(inputs.masking)' output.dat
inputs:
  - name: pair
    type: data
    format: tabular.gz,tabular
    label: "Pair file"
    help: "One element of KegAlign's pair-file collection: anchor segments, both strands, any number of targets."
  - name: target
    type: data
    format: twobit
    label: "Target sequence (2bit)"
  - name: query
    type: data
    format: twobit
    label: "Query sequence (2bit)"
  - name: scores
    type: data
    format: txt
    label: "Scoring file in LASTZ format"
    help: "Required, not optional: it must match the scoring KegAlign seeded with, and a UDT cannot express an optional argument."
  - name: gappedthresh
    type: integer
    value: 3000
    label: "Gapped extension threshold"
  - name: ydrop
    type: integer
    value: 9430
    label: "Y-drop"
  - name: inner
    type: integer
    optional: true
    label: "Interpolation threshold (blastz H)"
    help: "0 is lastz's default, off; measured byte-identical to omitting the option. UCSC's hg38 x panTro6 run used H=2000."
  - name: masking
    type: integer
    optional: true
    label: "Dynamic masking count (blastz M)"
    help: "0 is lastz's default, off. UCSC's hg38 x panTro6 run used M=254."
outputs:
  - name: output
    type: data
    format: lav
    from_work_dir: output.dat
    label: "output"
help:
  format: markdown
  content: |
    **What it does**

    Gapped extension for one KegAlign pair file, writing LAV. The pair file is split by target sequence
    (a stable partition, which keeps lastz's ordering rules), and each target's segments are run through
    lastz in calls of at most 50,000 segments, each with that one target selected.

    Convert the result with **lavToPsl** and chain it with **axtChain** on PSL input -- the route UCSC's
    ``doBlastzChainNet.pl`` takes. On a real 50,000-segment Cannabis chunk the PSL was 10x smaller than
    the equivalent AXT and gave identical chains.
