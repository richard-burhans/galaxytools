class: GalaxyUserTool
id: gt-ucsc-lavtopsl
version: "482+galaxy0"
name: ucsc_lavtopsl (UDT)
description: ": convert lastz LAV alignments to PSL"
container: quay.io/biocontainers/ucsc-lavtopsl:482--h0b57e2e_0
shell_command: |
  set -e
  ( test -s '$(inputs.input.path)' || : > output.dat )
  ( test ! -s '$(inputs.input.path)' || lavToPsl '$(inputs.input.path)' output.dat )
inputs:
  - name: input
    type: data
    format: lav
    label: "LAV alignments"
    help: "Several lastz runs concatenated into one file are fine: the result is the same PSL rows as converting each run separately (measured)."
outputs:
  - name: output
    type: data
    format: psl
    from_work_dir: output.dat
help:
  format: markdown
  content: |
    **What it does**

    Converts lastz's native LAV output to PSL, the format UCSC's ``doBlastzChainNet.pl`` feeds to
    ``axtChain -psl``. PSL carries coordinates and block structure but no sequence; axtChain reads the
    sequence from the 2bit files it is given anyway, so nothing is lost -- on a real Cannabis chunk the
    chains from PSL and from AXT were identical, and the PSL was a tenth the size.

    An empty input produces an empty output rather than an error.

    .. _source code: https://github.com/ucscGenomeBrowser/kent/tree/master/src/hg/mouseStuff/lavToPsl
