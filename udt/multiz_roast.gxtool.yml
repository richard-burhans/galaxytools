class: GalaxyUserTool
id: gt-multiz-roast
version: "11.2+galaxy1"
name: multiz_roast (UDT)
description: ": reference-guided multiple alignment of pairwise MAFs (multiz autoMZ)"
container: quay.io/biocontainers/multiz:11.2--hec16e2b_4
shell_command: |
  set -e
  cat > script.cfg <<'CONFIGFILE_SCRIPT'
  set -eu
  ref="$1"; treefile="$2"; output="$3"; files="$4"
  ## No input at all can only mean the inputs did not arrive (a piece of a split always has at least one
  ## species); roast would run on stubs alone and write headers with no blocks, so refuse instead.
  [ -n "$files" ] || { echo "no pairwise MAFs reached the job" >&2; exit 1; }
  case "$ref" in ''|*[!A-Za-z0-9_]*) echo "reference name must be letters, digits or _: $ref" >&2; exit 1;; esac
  mkdir work
  ## UCSC's tree preparation (kent src/hg/makeDb/doc/hg38/multiz5way.txt): branch lengths, the ';' and
  ## newlines go, commas become spaces: ((hg38 (tupChi1 galVar1)) (mm10 cavPor3)).
  tree=`sed 's/:[-0-9.eE]*//g; s/;//; /^ *$/d' "$treefile" | tr '\n' ' ' | sed 's/ //g; s/,/ /g'`
  leaves=" `echo "$tree" | tr '()' '  ' | tr -s ' '` "
  case "$leaves" in *" $ref "*) ;; *) echo "reference $ref is not in the tree" >&2; exit 1;; esac
  ## The species is read from the file, not from a dataset name: the first row that is not the reference.
  ## A file with no blocks names no species and is skipped; the stub below covers that species.
  IFS=','
  for f in $files; do
      unset IFS
      name=`awk -v ref="$ref" '/^s /{ split($2, p, "."); if (p[1] != ref) { print p[1]; exit } }' "$f"`
      IFS=','
      [ -n "$name" ] || continue
      case "$leaves" in *" $name "*) ;; *) echo "$name is not in the tree" >&2; exit 1;; esac
      if [ -e "work/$ref.$name.sing.maf" ]; then echo "$name is given twice" >&2; exit 1; fi
      ln -s "$f" "work/$ref.$name.sing.maf"
  done
  unset IFS
  ## a species in the tree with no alignment in this piece gets UCSC's empty stub (autoMultiz.csh)
  for s in $leaves; do
      [ "$s" = "$ref" ] && continue
      [ -e "work/$ref.$s.sing.maf" ] || echo '##maf version=1 scoring=autoMZ' > "work/$ref.$s.sing.maf"
  done
  echo "tree: $tree"
  cd work
  mkdir tmp
  roast + T="$PWD/tmp" E="$ref" "$tree" $ref.*.sing.maf out.maf > /dev/null
  cd ..
  mv work/out.maf "$output"
  CONFIGFILE_SCRIPT
  sh script.cfg '$(inputs.reference)' '$(inputs.tree.path)' output.dat '$(inputs.pairwise.reduce(function(a, x){ return a.concat(x && x.path ? [x] : Object.keys(x).map(function(k){ return x[k]; })); }, []).map(function(e){ return e.path; }).join(','))'
inputs:
  - name: pairwise
    type: data
    format: maf
    multiple: true
    label: "Pairwise MAFs, one per species"
    help: "One MAF per species, its rows named species.sequence (mm10.chr1), the reference as the top row of every block, sorted by reference position. The species is read from the rows, so the dataset names do not matter; map over the outer level of a nested list to run one piece per inner list."
  - name: reference
    type: text
    value: ""
    label: "Reference name"
    help: "As it prefixes the reference rows (hg38 for hg38.chr1). Letters, digits and _ only."
  - name: tree
    type: data
    format: newick,nhx,txt
    label: "Species tree"
    help: "Newick; branch lengths are ignored. Every species (and the reference) must be a leaf."
outputs:
  - name: output
    type: data
    format: maf
    from_work_dir: output.dat
help:
  format: markdown
  content: |
    **What it does**

    Runs ``roast`` (multiz's ``autoMZ``) over one set of pairwise MAFs that share a reference, as UCSC's
    ``autoMultiz.csh`` does for each piece of a multizNway build:

    ::

        autoMZ + T=$tmp E=$db "`cat tree.nh`" $db.*.sing.maf $c

    Each input becomes ``<reference>.<species>.sing.maf``, the species read from the file's first non-reference row, so dataset names play no part. A species in the tree with no input, or an
    empty one, gets UCSC's stub ``##maf version=1 scoring=autoMZ``, so one piece of a genome split can
    be run without every species aligning to it.

    The tree is prepared as UCSC does: branch lengths, ``;`` and newlines are removed and commas become
    spaces, giving ``((hg38 (tupChi1 galVar1)) (mm10 cavPor3))``. UCSC's scripts also strip a lowercase
    ``name_`` prefix, which exists for their common-name trees; it is not applied here, because the leaves
    must be the species names the MAF rows use.

    .. warning:: Pairwise inputs must be sorted by reference position. multiz merges unsorted input
       wrongly with exit status 0. ``netToAxt | axtSort | axtToMaf`` (or ``mafSplit`` of such a file)
       gives the right order.

    **Output** is roast's MAF: header ``##maf version=1 scoring=roast.v3.3``, blocks with the reference on
    top, and a final ``##eof maf``. Gap annotation (``mafAddIRows``) is a separate, per-sequence step.

    .. _multiz: https://github.com/multiz/multiz
