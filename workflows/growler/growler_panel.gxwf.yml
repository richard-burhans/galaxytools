# GENERATED by assemble.py from growler.gxwf.yml -- DO NOT EDIT BY HAND.
# gxformat2 has no include directive, so the subworkflow is inlined. Edit growler.gxwf.yml and
# re-run ./assemble.py; ./assemble.py --check fails if this file is stale.
class: GalaxyWorkflow
label: Growler panel (every genome pair)
doc: 'Runs Growler over every ordered pair of a genome collection.


  __CROSS_PRODUCT_FLAT__ emits two aligned flat lists; feeding output_a to the target

  input and output_b to the query input is how a pair reaches a two-input consumer

  natively -- Galaxy then matches them element-wise. __FILTER_FROM_FILE__ removes the

  diagonal, which is the N self-pairs an all-against-all grid always contains and which

  are meaningless to align.


  The output is list:list -- outer = genome pair, inner = chromosome pair -- with both

  identifiers preserved, so downstream steps can regroup on either axis.


  ⚠ Job count is the scaling wall, not compute. For a panel of N genomes with C

  chromosomes this is N*(N-1) Growler invocations, each mapping LASTZ over roughly C^2

  pair files. Ten genomes of ten chromosomes is ~9,000 LASTZ jobs; fourteen chromosomes across

  ten genomes is ~17,600. That is Galaxy''s scheduler and database, not the aligner.'
inputs:
  genomes:
    type: collection
    collection_type: list
    doc: Soft-masked genomes, one element per strain. These element identifiers become the pair ids and,
      eventually, browser track names.
    position:
      top: 0
      left: 0
  self_pairs:
    type: data
    doc: One 'X_X' line per strain. A file rather than a parameter because Galaxy filters collections
      by matching identifiers against file CONTENT, and the identifiers are only known once the panel
      is chosen.
    position:
      top: 150
      left: 0
  scores:
    type: data
    optional: true
    doc: Scoring file in LASTZ format, shared by every pair.
    position:
      top: 260
      left: 0
  output_format:
    type: text
    default: axt
    doc: LASTZ output format, shared by every pair. Defaults to axt because the consumer is axtChain,
      which accepts axt,psl only. Lifted to the panel rather than left at the subworkflow's default so
      that ONE setting governs the whole panel -- a panel whose pairs disagreed about their format would
      produce a collection its consumer can only partly read.
    position:
      top: 370
      left: 0
steps:
  pairs:
    tool_id: __CROSS_PRODUCT_FLAT__
    label: pairs
    in:
      input_a: genomes
      input_b: genomes
    position:
      top: 0
      left: 260
  targets:
    tool_id: __FILTER_FROM_FILE__
    label: targets
    in:
      input: pairs/output_a
      how|filter_source: self_pairs
    state:
      how:
        how_filter: remove_if_present
    position:
      top: 0
      left: 520
  queries:
    tool_id: __FILTER_FROM_FILE__
    label: queries
    in:
      input: pairs/output_b
      how|filter_source: self_pairs
    state:
      how:
        how_filter: remove_if_present
    position:
      top: 160
      left: 520
  growler:
    run:
      class: GalaxyWorkflow
      label: Growler (one genome pair)
      doc: 'Growler: one genome pair in, a pair-keyed alignment collection out.


        KegAlign emits a collection of PAIR FILES -- one gzipped segments file per (target, query) chromosome

        pair, both strands -- plus the two 2bits as their own datasets. Growler LASTZ is then mapped

        over that collection. There is no tarball, no commands.json, no format.txt, and no collapse:

        the chromosome-pair key created by KegAlign is carried by Galaxy''s element identifiers all the

        way to chaining.


        ▶ USE THIS AS A SUBWORKFLOW. Mapped over a genome-pair collection it emits `list:list`

        (outer = genome pair, inner = chromosome pair) with outer identifiers preserved -- measured on

        usegalaxy.org 26.1, 2026-09-17. That is what makes the panel case work: Galaxy does NOT

        broadcast a dataset across nesting levels, but inside one Growler invocation there is only one

        level, so nothing needs broadcasting.


        ⚠ EVERY MAPPED JOB RUNS THE SAME COMMAND LINE. The 5,177 commands of a real bundle collapse to

        8 argument signatures, and dropping `subset=` and `--strand` collapses those 8 to 1 (both

        measured byte-identical). So no element identifier has to reach a text parameter -- which is

        the limitation that killed every multiz fold on 2026-06-13.


        ⚠ The scoring file, gapped threshold, y-drop and interpolation are passed to BOTH stages. They

        have to agree: KegAlign uses them to choose anchors, Growler LASTZ to extend them.

        '
      inputs:
        target_fasta:
          type: data
          doc: Target genome, FASTA or FASTA.gz. KegAlign converts it to 2bit inside the job.
          position:
            top: 0
            left: 0
        query_fasta:
          type: data
          doc: Query genome, FASTA or FASTA.gz.
          position:
            top: 110
            left: 0
        scores:
          type: data
          optional: true
          doc: 'Scoring file in LASTZ format. Optional; omitted, both stages use LASTZ''s built-in matrix.
            It is wired to both stages from this single input precisely so they cannot drift apart.

            '
          position:
            top: 220
            left: 0
        output_format:
          type: text
          default: axt
          doc: 'LASTZ output format for the gapped-extension stage: `axt`, `axt+`, `maf` or `maf-`.

            ⛔ IT DEFAULTS TO axt BECAUSE THE CONSUMER DECIDES, AND GROWLER''S CONSUMER IS `axtChain`,
            which accepts `axt,psl` ONLY. Hardcoded to `maf-`, as this workflow was until 2026-09-19,
            Growler cannot feed the chain path at all. `maf-` remains the right choice for a standalone
            run whose consumer parses MAF -- which is why this is an input rather than a second default.

            ⚠ The tool maps axt/axt+ to the `axt` datatype through a change_format rule, so a downstream
            step binds without a datatype override. Set this to a MAF variant and the chain steps will
            refuse the connection, which is the failure you want: loud, at edit time.

            '
          position:
            top: 330
            left: 0
      outputs:
        alignments:
          outputSource: growler_lastz/output
          doc: One alignment per chromosome pair, keyed <target>__<query>.
        target_2bit:
          outputSource: kegalign/target_2bit
        query_2bit:
          outputSource: kegalign/query_2bit
      steps:
        kegalign:
          tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/kegalign/kegalign/0.3.3+galaxy2
          label: kegalign
          doc: 'Seed, filter and gap-free extension on the GPU. `bundle_selector: collection` makes it
            emit pair files instead of data_package.tgz; the tarball path is untouched and still available.

            ⚠ The format set here is INERT on the collection path -- kegalign.xml says so in its own words:
            `--format` still selects what KegAlign writes into its command lines, and nothing on this
            path reads them. The format that reaches lastz is `output_format`, below. Do not "fix" the
            two to agree; they are not the same setting.

            '
          in:
            target: target_fasta
            query: query_fasta
            scoring_options|scoring: scores
          state:
            bundle_selector: collection
            batch_lines: 0
            sequence_options:
              strand_selector: both
            output_options:
              format:
                format_selector: maf
                maf_type: maf-
          position:
            top: 0
            left: 260
        growler_lastz:
          tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/kegalign/growler_lastz/1.04.52+galaxy6
          label: growler_lastz
          doc: 'Gapped extension, mapped over the pair file collection: N independent jobs, one lastz
            each, and the 2bits and scoring file ride along as fixed inputs rather than being copied into
            every element. At 210 MB each the 2bits would be ~42 GB of inflation across 100 pair files.

            '
          in:
            pair: kegalign/pairs
            target: kegalign/target_2bit
            query: kegalign/query_2bit
            scores: scores
            format_selector: output_format
          state:
            gappedthresh: 3000
            ydrop: 9430
            interpolation:
              inner_selector: 'no'
          position:
            top: 0
            left: 560
    label: growler
    doc: Mapped over the pair lists. Each invocation sees one genome pair and emits a flat pair file collection;
      Galaxy nests those into list:list.
    in:
      target_fasta: targets/output_filtered
      query_fasta: queries/output_filtered
      scores: scores
      output_format: output_format
    position:
      top: 0
      left: 800
outputs:
  alignments:
    outputSource: growler/alignments
