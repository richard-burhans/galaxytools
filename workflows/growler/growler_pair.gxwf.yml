class: GalaxyWorkflow
label: Growler pair (one genome pair, through chains)
doc: 'One genome pair in; cleaned chains, reciprocal-best chains and the pairwise AXT out.


  Growler is nested inside, so the chromosome-pair axis is born at growler_lastz and dies at chainMergeSort,
  both inside this document. The caller therefore maps over a flat genome-pair list and gets flat outputs
  back -- it never handles list:list.


  ⚠ axtChain is MAPPED over the chromosome-pair axis and takes the whole target and query genome in every
  one of those jobs. Measured on a real Cannabis chromosome pair over three alignment sizes spanning 240x,
  whole-genome FASTA costs a FIXED +1.30 to +1.36 GB of peak RSS against the same run given 2bit, with
  byte-identical chain counts. On a realistic job -- 1.69 GB of AXT, 1.7 million chains -- that is 3.58
  GB against 2.23 GB, so it is the memory a TPV entry must carry rather than a runtime problem: the same
  fixed cost is only +6.4 s on a 128 s job, about 5%.


  ▶ It is recoverable for nothing. KegAlign already emits both 2bits and Growler already carries them;
  ucsc_axtchain hardcodes -faT/-faQ and declares its sequence inputs as fasta, so this document passes
  FASTA as WF-C does until that changes.


  ⚠ The chain arm is lifted verbatim from WF-C, including its DELIBERATE divergence from doRecipBest.pl:
  chainNet alone on its defaults, no chainPreNet on the rbest arm.'
