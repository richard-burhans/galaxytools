        query_2bit:
          outputSource: kegalign/query_2bit
      steps:
        kegalign:
          tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/kegalign/kegalign/0.3.3+galaxy1
          label: kegalign
          doc: 'Seed, filter and gap-free extension on the GPU. `bundle_selector: collection` makes it
            emit pair files instead of data_package.tgz; the tarball path is untouched and still available.

            ⚠ The format set here is INERT on the collection path -- kegalign.xml says so in its own words:
            `--format` still selects what KegAlign writes into its command lines, and nothing on this
            path reads them. The format that reaches lastz is `output_format`, below. Do not "fix" the
            two to agree; they are not the same setting.

            '
          in:
            target: target_fasta
            query: query_fasta
            scoring_options|scoring: scores
          state:
            bundle_selector: collection
            batch_lines: 0
            sequence_options:
              strand_selector: both
            output_options:
              format:
                format_selector: maf
                maf_type: maf-
          position:
            top: 0
            left: 260
        growler_lastz:
          tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/kegalign/growler_lastz/1.04.52+galaxy5
          label: growler_lastz
          doc: 'Gapped extension, mapped over the pair file collection: N independent jobs, one lastz
            each, and the 2bits and scoring file ride along as fixed inputs rather than being copied into
            every element. At 210 MB each the 2bits would be ~42 GB of inflation across 100 pair files.

            '
          in:
            pair: kegalign/pairs
            target: kegalign/target_2bit
            query: kegalign/query_2bit
            scores: scores
            format_selector: output_format
          state:
            gappedthresh: 3000
            ydrop: 9430
            interpolation:
              inner_selector: 'no'
          position:
            top: 0
            left: 560
    label: growler
    doc: 'KegAlign on the GPU, then LASTZ mapped over the pair files. The inner axis is born here: one
      alignment per chromosome pair, keyed <target>__<query>.'
    in:
      target_fasta: target_fasta
      query_fasta: query_fasta
      scores: scores
      output_format: output_format
    position:
      top: 0
      left: 300
  axtchain:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_axtchain/ucsc_axtchain/482+galaxy3
    label: axtchain
    doc: 'MAPPED over the chromosome-pair axis. The two genomes are plain data inputs, which Galaxy broadcasts
      across the map -- that is allowed; it is broadcasting across NESTING LEVELS that is not, which is
