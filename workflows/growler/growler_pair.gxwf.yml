  target_fasta:
    type: data
    doc: Soft-masked target genome.
    position:
      top: 0
      left: 0
  query_fasta:
    type: data
    doc: Soft-masked query genome.
    position:
      top: 110
      left: 0
  target_sizes:
    type: data
