class: GalaxyWorkflow
label: Growler (one genome pair)
doc: 'Growler: one genome pair in, a pair-keyed alignment collection out.


  KegAlign emits a collection of PAIR FILES -- one gzipped segments file per (target, query) chromosome

  pair, both strands -- plus the two 2bits as their own datasets. Growler LASTZ is then mapped

  over that collection. There is no tarball, no commands.json, no format.txt, and no collapse:

  the chromosome-pair key created by KegAlign is carried by Galaxy''s element identifiers all the

  way to chaining.


  ▶ USE THIS AS A SUBWORKFLOW. Mapped over a genome-pair collection it emits `list:list`

  (outer = genome pair, inner = chromosome pair) with outer identifiers preserved -- measured on

  usegalaxy.org 26.1, 2026-09-17. That is what makes the panel case work: Galaxy does NOT

  broadcast a dataset across nesting levels, but inside one Growler invocation there is only one

  level, so nothing needs broadcasting.


  ⚠ EVERY MAPPED JOB RUNS THE SAME COMMAND LINE. The 5,177 commands of a real bundle collapse to

  8 argument signatures, and dropping `subset=` and `--strand` collapses those 8 to 1 (both

  measured byte-identical). So no element identifier has to reach a text parameter -- which is

  the limitation that killed every multiz fold on 2026-06-13.


  ⚠ The scoring file, gapped threshold, y-drop and interpolation are passed to BOTH stages. They

  have to agree: KegAlign uses them to choose anchors, Growler LASTZ to extend them.

  '
inputs:
  target_fasta:
    type: data
    doc: Target genome, FASTA or FASTA.gz. KegAlign converts it to 2bit inside the job.
    position:
      top: 0
      left: 0
  query_fasta:
    type: data
    doc: Query genome, FASTA or FASTA.gz.
    position:
      top: 110
      left: 0
  scores:
    type: data
    optional: true
    doc: 'Scoring file in LASTZ format. Optional; omitted, both stages use LASTZ''s built-in matrix. It
      is wired to both stages from this single input precisely so they cannot drift apart.

      '
    position:
      top: 220
      left: 0
  output_format:
    type: text
    default: axt
    doc: 'LASTZ output format for the gapped-extension stage: `axt`, `axt+`, `maf` or `maf-`.

      ⛔ IT DEFAULTS TO axt BECAUSE THE CONSUMER DECIDES, AND GROWLER''S CONSUMER IS `axtChain`, which
      accepts `axt,psl` ONLY. Hardcoded to `maf-`, as this workflow was until 2026-09-19, Growler cannot
      feed the chain path at all. `maf-` remains the right choice for a standalone run whose consumer
      parses MAF -- which is why this is an input rather than a second default.

      ⚠ The tool maps axt/axt+ to the `axt` datatype through a change_format rule, so a downstream step
      binds without a datatype override. Set this to a MAF variant and the chain steps will refuse the
      connection, which is the failure you want: loud, at edit time.

      '
    position:
      top: 330
      left: 0
  step:
    type: integer
    default: 1
    doc: 'Offset between successive target words considered for the seed table.

      '
    position:
      top: 550
      left: 0
  notransition:
    type: boolean
    default: false
    doc: 'Disallow one transition in a seed hit. False permits one, which is LASTZ''s default.

      '
    position:
      top: 660
      left: 0
  hspthresh:
    type: integer
    default: 3000
    doc: 'Segment score threshold for high-scoring pairs -- the ungapped-extension cutoff, and the only

      knob that reduces how much work the gapped stage inherits.

      '
    position:
      top: 770
      left: 0
  xdrop:
    type: integer
    default: 910
    doc: 'X-drop value for gap-free extension.

      '
    position:
      top: 880
      left: 0
  noentropy:
    type: boolean
    default: false
    doc: 'Disable the entropy adjustment on ungapped scores. False leaves entropy ON.

      ⚠ ON at USE time and OFF for TRAINING: entropy preferentially discards low-complexity

      segments, which biases a training set but complements masking at use time.

      '
    position:
      top: 990
      left: 0
  num_gpu:
    type: integer
    default: 1
    doc: 'GPUs to use. ⛔ THE TOOL DEFAULT IS -1, MEANING EVERY GPU ON THE NODE. That is not a

      reasonable default for a shared machine, which is why this is stated here.

      '
    position:
      top: 1100
      left: 0
  debug:
    type: boolean
    default: true
    doc: 'Print per-phase timings. ⚠ Defaults TRUE here against the tool''s False: the timings are

      unrecoverable after the job ends, and they are the only measurement of where a run spent

      its GPU time.

      '
    position:
      top: 1210
      left: 0
outputs:
  alignments:
    outputSource: growler_lastz/output
    doc: One alignment per chromosome pair, keyed <target>__<query>.
  target_2bit:
    outputSource: kegalign/target_2bit
  query_2bit:
    outputSource: kegalign/query_2bit
steps:
  kegalign:
    tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/kegalign/kegalign/0.3.4+galaxy0
    label: kegalign
    doc: 'Seed, filter and gap-free extension on the GPU. `bundle_selector: collection` makes it emit
      pair files instead of data_package.tgz; the tarball path is untouched and still available.

      ⚠ The format set here is INERT on the collection path -- kegalign.xml says so in its own words:
      `--format` still selects what KegAlign writes into its command lines, and nothing on this path reads
      them. The format that reaches lastz is `output_format`, below. Do not "fix" the two to agree; they
      are not the same setting.



      ⛔ `seed` IS STATE, NOT AN INPUT, AND THAT IS GALAXY''S CONSTRAINT RATHER THAN A CHOICE. It is a
      CONDITIONAL SELECTOR: the selected case determines the step''s structure, so it has to be known
      when the workflow is defined. Wired to a `text` input, the workflow imports cleanly with zero step
      errors and then refuses every invocation with `The selected case is unavailable/invalid` -- measured
      on laila 2026-09-24. Every other seeding parameter is a plain scalar and connects normally.

      ⚠ So changing the seed means editing this document. `12of19` is both the tool default and this project''s
      settled value; `14of22` was tested and rejected, and it is also what overran the GPU seed buffer.

      '
    in:
      target: target_fasta
      query: query_fasta
      scoring_options|scoring: scores
      seeding_options|step: step
      seeding_options|notransition: notransition
      ungapped_extension_options|hspthresh: hspthresh
      ungapped_extension_options|xdrop: xdrop
      ungapped_extension_options|noentropy: noentropy
      system_options|num_gpu: num_gpu
      system_options|debug: debug
    state:
      bundle_selector: collection
      batch_lines: 0
      sequence_options:
        strand_selector: both
      output_options:
        format:
          format_selector: maf
          maf_type: maf-
      scoring_options:
        ambiguous_selector: x
        ambiguous_params:
          set_ambiguous_params_selector: 'false'
      gapped_extension_options:
        ydrop: 9430
        gappedthresh: 3000
        notrivial: false
      interpolation_options:
        inner: -1
      developer:
        alignment_type: vertebrates_default
      system_options:
        wga_chunk_size: 250000
        lastz_interval_size: 10000000
        seq_block_size: 400000000
      seeding_options:
        seed:
          seed_selector: 12of19
    position:
      top: 0
      left: 260
  growler_lastz:
    tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/kegalign/growler_lastz/1.04.52+galaxy7
    label: growler_lastz
    doc: 'Gapped extension, mapped over the pair file collection: N independent jobs, one lastz each,
      and the 2bits and scoring file ride along as fixed inputs rather than being copied into every element.
      At 210 MB each the 2bits would be ~42 GB of inflation across 100 pair files.

      '
    in:
      pair: kegalign/pairs
      target: kegalign/target_2bit
      query: kegalign/query_2bit
      scores: scores
      format_selector: output_format
    state:
      gappedthresh: 3000
      ydrop: 9430
      interpolation:
        inner_selector: 'no'
    position:
      top: 0
      left: 560
