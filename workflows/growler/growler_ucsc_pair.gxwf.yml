class: GalaxyWorkflow
label: Growler UCSC pair (KegAlign + UCSC chain/net, flat)
doc: 'One genome pair: KegAlign seeding, then kent''s doBlastzChainNet.pl and doRecipBest.pl steps. See
  assemble_ucsc.py for the line-by-line provenance.'
inputs:
  target_fasta:
    type: data
    doc: Target genome, soft-masked FASTA.
  query_fasta:
    type: data
    doc: Query genome, soft-masked FASTA.
  target_sizes:
    type: data
    doc: Target chromosome sizes (name<TAB>length).
  query_sizes:
    type: data
    doc: Query chromosome sizes.
  scores:
    type: data
    doc: 'lastz scoring matrix, uploaded as tabular: KegAlign and lastz read it as text, axtChain as tabular.'
  linear_gap:
    type: data
    doc: 'axtChain gap-cost table: gap/loose.lineargap (chicken-human) or gap/medium.lineargap (mouse-human
      and closer).'
  hspthresh:
    type: integer
    default: 3000
    doc: blastz K. lastz default 3000.
  gappedthresh:
    type: integer
    default: 3000
    doc: blastz L; lastz default L=K. Fed to BOTH stages.
  xdrop:
    type: integer
    default: 910
    doc: blastz X. lastz's default is 10 x the matrix's A/A score.
  ydrop:
    type: integer
    default: 9430
    doc: blastz Y. lastz's default is O + 300E for the matrix used. Fed to BOTH stages.
  inner:
    type: integer
    default: 0
    doc: 'blastz H; 0 is off. UCSC hg38 x panTro6: 2000.'
  masking:
    type: integer
    default: 0
    doc: blastz M; 0 is off. Acts in the gapped stage only (KegAlign seeds).
  notransition:
    type: boolean
    default: false
    doc: blastz T=2 is 12of19 with --notransition.
  noentropy:
    type: boolean
    default: false
    doc: blastz P=1 (entropy on) is the default.
  chain_min_score:
    type: integer
    default: 1000
    doc: axtChain -minScore. doBlastzChainNet.pl's default is axtChain's own, 1000.
  batch_lines:
    type: integer
    default: 1000000
    doc: KegAlign segment lines per element; 0 is one element per chromosome pair.
  num_gpu:
    type: integer
    default: 1
    doc: KegAlign GPUs. The tool default, -1, means every GPU on the node.
outputs:
  all_chain:
    outputSource: chainmergesort/out
    doc: hg38.panTro6.all.chain analogue
  net:
    outputSource: netsyntenic/out
    doc: noClass.net
  over_chain:
    outputSource: over_chain/output
    doc: the liftOver chain
  syn_net:
    outputSource: syn_net/out
  synnet_maf:
    outputSource: synnet_maf/out
    doc: multiz input for close genomes
  rbest_chain:
    outputSource: rb_chain/out
  rbest_net:
    outputSource: rb_net/out
  rbest_maf:
    outputSource: rbest_maf/out
    doc: multiz input for other genomes
  lav:
    outputSource: lastz_lav/output
    doc: 'per-element LAV, kept: the raw alignment record'
