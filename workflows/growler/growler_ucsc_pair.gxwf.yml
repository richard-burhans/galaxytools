    label: kegalign
    doc: 'Seed, filter and gap-free extension on the GPU. `bundle_selector: collection` makes it emit
      pair files instead of data_package.tgz; the tarball path is untouched and still available.

      ⚠ The format set here is INERT on the collection path -- kegalign.xml says so in its own words:
      `--format` still selects what KegAlign writes into its command lines, and nothing on this path reads
      them. The format that reaches lastz is `output_format`, below. Do not "fix" the two to agree; they
      are not the same setting.



      ⛔ `seed` IS STATE, NOT AN INPUT, AND THAT IS GALAXY''S CONSTRAINT RATHER THAN A CHOICE. It is a
      CONDITIONAL SELECTOR: the selected case determines the step''s structure, so it has to be known
      when the workflow is defined. Wired to a `text` input, the workflow imports cleanly with zero step
      errors and then refuses every invocation with `The selected case is unavailable/invalid` -- measured
      on laila 2026-09-24. Every other seeding parameter is a plain scalar and connects normally.

      ⚠ So changing the seed means editing this document. `12of19` is both the tool default and this project''s
      settled value; `14of22` was tested and rejected, and it is also what overran the GPU seed buffer.

      '
