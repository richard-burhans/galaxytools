categories:
- Next Gen Mappers
description: Galaxy wrapper for LASTZ gapped extension over one chromosome pair
homepage_url: https://github.com/galaxyproject/KegAlign
long_description: |
  Growler LASTZ performs the gapped-extension stage for a single pair
  file: one element of the collection KegAlign emits with
  --output-type collection, holding every anchor segment for one
  (target, query) chromosome pair, both strands. Galaxy maps the tool
  over that collection, so the chromosome-pair key survives from
  alignment through to chaining without a tarball, a command manifest
  or a collapse step.
name: growler_lastz
owner: richard-burhans
remote_repository_url: https://github.com/richard-burhans/galaxytools/tree/main/tools/growler_lastz
type: unrestricted
