name: fastan
owner: richard-burhans
description: FasTAN tandem-repeat arrays as content-annotated BED6
long_description: |
  Runs FAtoGDB, FasTAN (-m -p), and ONEview on an upper-cased FASTA and
  converts tandem-repeat annotations into a content-annotated BED6 track.
