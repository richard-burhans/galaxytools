name: maf_name_rows
owner: richard-burhans
description: Name the rows of pairwise MAFs species.sequence, by row position
long_description: |
  Gives each block of an axtToMaf pairwise MAF the row names multiz roast needs:
  row 1 becomes <reference>.<sequence>, row 2 <species>.<sequence>, with optional
  per-genome sequence renames. Rows are told apart by position, never by name.
  A second mode renames species prefixes after roast.
