name: windowmasker
owner: richard-burhans
description: NCBI WindowMasker genome-frequency repeat/low-complexity intervals as content-annotated BED6
long_description: |
  Runs two-pass NCBI BLAST+ windowmasker (-mk_counts and -ustat) on an
  upper-cased FASTA and classifies masked intervals into a content-annotated BED6 track.
